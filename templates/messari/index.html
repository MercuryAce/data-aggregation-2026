{% extends "base.html" %}

{% block title %}Messari — CryptoDash{% endblock %}

{% block content %}
<div class="container py-4">
    <h1 class="h3 mb-3">Messari assets</h1>
    <p class="text-muted small">Cached market data (BTC / ETH on free tier).</p>

    {% if last_updated %}
    <p class="text-muted small">Last synced: {{ last_updated }}</p>
    {% endif %}

    <pre class="small bg-dark text-light p-3 rounded overflow-auto" style="max-height: 70vh;">{{ details | tojson(indent=2) }}</pre>
</div>
{% endblock %}
