{% extends "base.html" %}

{% block title %}{{ slug | title }} — Messari — CryptoDash{% endblock %}

{% block content %}
<div class="container py-4">
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{{ url_for('messari.index') }}">Messari</a></li>
            <li class="breadcrumb-item active">{{ slug }}</li>
        </ol>
    </nav>

    <h1 class="h3 mb-3">{{ slug | title }}</h1>

    {% if last_updated %}
    <p class="text-muted small">Last synced: {{ last_updated }}</p>
    {% endif %}

    <pre class="small bg-dark text-light p-3 rounded overflow-auto" style="max-height: 70vh;">{{ details | tojson(indent=2) }}</pre>
</div>
{% endblock %}
