{# Hide page until fully themed; tokens.css sets palette before Bootstrap loads #}
<style>
  html { background-color: #0d1117; }
  html.js:not(.ready) body {
    opacity: 0;
    pointer-events: none;
  }
  html.ready body {
    opacity: 1;
    transition: opacity 0.2s ease-out;
  }
</style>
<script>document.documentElement.classList.add("js");</script>
