{% extends "base.html" %}

{% block title %}DefiLlama Protocols — CryptoDash{% endblock %}

{% block content %}
<div class="container py-4">
    <h1 class="h3 mb-3">DefiLlama protocols</h1>

    {% if last_updated %}
    <p class="text-muted small">Last synced: {{ last_updated }}</p>
    {% endif %}

    <pre class="small bg-dark text-light p-3 rounded overflow-auto" style="max-height: 70vh;">{{ protocols | tojson(indent=2) }}</pre>
</div>
{% endblock %}
